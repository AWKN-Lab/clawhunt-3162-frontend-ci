name: Frontend CI

# 前端 CI：工作台（web）与小程序（miniprogram）两个作业。
# 触发：PR 改动 web/**、miniprogram/**、scripts/** 或本工作流文件时运行。
# 两个作业各自有路径过滤（changes 作业判定），只有被改到的作业才跑；
# 验收 1 的演示 PR 同时改 web/** 与 miniprogram/**，两个作业都会跑。
# scripts/ 只映射两个检查脚本：check-bundle-size.mjs → web、
# check-appid.mjs → miniprogram；改其他脚本不触发作业。
on:
  pull_request:
    paths:
      - 'web/**'
      - 'miniprogram/**'
      - 'scripts/**'
      - '.github/workflows/frontend-ci.yml'

# 只读权限：作业只读源码、不写仓库、不打印环境变量。
permissions:
  contents: read

# 同分支新提交取消旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    # dorny/paths-filter 在 pull_request 事件中调 GitHub REST API 取 PR 文件列表，
    # 需要 pull-requests: read；只给 changes 作业加，web/miniprogram 保持 contents: read。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      miniprogram: ${{ steps.filter.outputs.miniprogram }}
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 路径过滤
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'scripts/check-bundle-size.mjs'
              - '.github/workflows/frontend-ci.yml'
            miniprogram:
              - 'miniprogram/**'
              - 'scripts/check-appid.mjs'
              - '.github/workflows/frontend-ci.yml'

  web:
    name: web（工作台）
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_MAX_KB: '800'
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10'
      - name: 安装 Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: lint
        run: pnpm lint
        working-directory: web
      - name: typecheck
        run: pnpm typecheck
        working-directory: web
      - name: test
        run: pnpm test --run
        working-directory: web
      - name: build
        run: pnpm build
        working-directory: web
      - name: 体积门禁
        run: node ../scripts/check-bundle-size.mjs --dist dist
        working-directory: web
        env:
          BUNDLE_MAX_KB: ${{ env.BUNDLE_MAX_KB }}
      - name: 上传 dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  miniprogram:
    name: miniprogram（小程序）
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10'
      - name: 安装 Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: miniprogram
      - name: typecheck
        run: pnpm typecheck
        working-directory: miniprogram
      - name: lint
        run: pnpm lint
        working-directory: miniprogram
      - name: appid 占位检查
        run: node ../scripts/check-appid.mjs --config project.config.json
        working-directory: miniprogram
